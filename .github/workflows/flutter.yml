name: Flutter M0
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - name: Verify localized UI strings
        run: dart run tool/check_localized_ui.dart
      - name: Apply formatting
        run: |
          dart format lib test tool
          if git diff --quiet -- lib test tool; then
            echo "No formatting changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test tool
            git commit -m "chore: format UI localization and combat"
            git push origin HEAD:tmp/ui-l10n-combat-format
          fi
      - run: flutter analyze
      - run: flutter test
      - run: dart test test/domain test/game_engine
