name: Flutter M0
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - name: Verify localized UI strings
        run: dart run tool/check_localized_ui.dart
      - name: Apply compact combat formatting
        run: |
          dart format lib/features/combat/presentation/v1/ashfang_combat_v1_screen.dart lib/features/combat/presentation/v1/ashfang_rematch_v1_screen.dart
          if git diff --quiet -- lib/features/combat/presentation/v1/ashfang_combat_v1_screen.dart lib/features/combat/presentation/v1/ashfang_rematch_v1_screen.dart; then
            echo "No formatting changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/features/combat/presentation/v1/ashfang_combat_v1_screen.dart lib/features/combat/presentation/v1/ashfang_rematch_v1_screen.dart
            git commit -m "chore: format compact combat layout"
            git push origin HEAD:tmp/compact-layout-format
          fi
      - run: flutter analyze
      - run: flutter test
      - run: dart test test/domain test/game_engine
