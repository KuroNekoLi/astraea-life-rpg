name: Flutter M0
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - name: Apply combat formatting
        run: |
          dart format lib/game_engine/combat/v1 test/game_engine/combat/v1
          if git diff --quiet -- lib/game_engine/combat/v1 test/game_engine/combat/v1; then
            echo "No combat formatting changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/game_engine/combat/v1 test/game_engine/combat/v1
            git commit -m "chore: format combat M1-M5"
            git push origin HEAD:tmp/combat-m1-m5-format-debug
          fi
      - run: flutter analyze
      - run: flutter test
      - run: dart test test/domain test/game_engine
