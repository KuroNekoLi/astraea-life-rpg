name: astraea_life_rpg
description: Astraea Life RPG MVP client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  drift: ^2.35.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  build_runner: ^2.16.1
  test: ^1.31.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/content/quests/mvp_v1.json
    - assets/content/story/scene_1_5_v1.json
    - assets/content/spells/mvp_pool_v1.json
    - assets/content/encounters/ashfang_training_v2.json
    - assets/content/progression/character_growth_mvp_v1.json
